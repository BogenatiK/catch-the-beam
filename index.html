<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Поймай луч: Земля → Марс</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game-wrap">
    <canvas id="game-canvas"></canvas>

    <div id="hud">
      <div class="hud-item">
        <span class="hud-label">Заряд</span>
        <div class="battery">
          <div id="battery-fill" class="battery-fill"></div>
        </div>
        <span id="battery-value" class="hud-value">100%</span>
      </div>
      <div class="hud-item">
        <span class="hud-label">До Марса</span>
        <span id="progress-value" class="hud-value">100%</span>
      </div>
    </div>

    <div id="progress-bar">
      <div id="progress-fill"></div>
      <span class="progress-label progress-label-start">Земля</span>
      <span class="progress-label progress-label-end">Марс</span>
    </div>

    <div id="menu-screen" class="overlay">
      <h1 class="title">Земля → Марс</h1>
      <p class="subtitle">
        Управляй солнечным парусом, лови лучи для подзарядки
        и уклоняйся от астероидов.
      </p>
      <div class="difficulty-buttons">
        <button class="btn difficulty-btn" data-difficulty="easy">Лёгкий</button>
        <button class="btn difficulty-btn" data-difficulty="medium">Средний</button>
        <button class="btn difficulty-btn" data-difficulty="hard">Сложный</button>
      </div>
      <p class="hint">Управление: движение мыши или пальца влево-вправо</p>
    </div>

    <div id="result-screen" class="overlay hidden">
      <h1 id="result-title" class="title">Результат</h1>
      <p id="result-text" class="subtitle"></p>
      <button id="restart-btn" class="btn">Заново</button>
      <button id="menu-btn" class="btn btn-secondary">Выбрать сложность</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
